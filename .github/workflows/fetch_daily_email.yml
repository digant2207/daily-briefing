name: Fetch Daily Briefing Email & Update GitHub Page

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'index.html'
      - 'README.md'
      - '.gitignore'
  schedule:
    # Check every 15 minutes between 06:30 AM and 01:00 PM IST (01:00 to 07:30 UTC)
    # Automatically idles once today's morning email is published
    - cron: '*/15 1-7 * * *'
    # Additional checks at 08:00 UTC (1:30 PM IST) and 10:00 UTC (3:30 PM IST)
    - cron: '0 8,10 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab or API
    inputs:
      force_update:
        description: 'Force overwrite index.html even if today report is already published (true/false)'
        required: false
        default: 'false'
        type: boolean
  repository_dispatch: # Allows external cron jobs (e.g. cron-job.org, webhook)
    types: [cron_trigger, daily_brief, fetch_email]

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Fetch Daily Email & Build HTML Page
        env:
          TZ: 'Asia/Kolkata'
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          SENDER_FILTER: ${{ secrets.SENDER_FILTER }}
          SUBJECT_FILTER: ${{ secrets.SUBJECT_FILTER }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || github.event.client_payload.force_update || 'false' }}
        run: |
          python fetch_email.py

      - name: Commit and Push Updated HTML Page
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit."
          else
            git commit -m "Auto-update Daily Brief page from email [skip ci]"
            if ! git push origin main; then
              echo "Push failed due to remote changes. Rebasing and retrying..."
              git pull --rebase origin main
              git push origin main
            fi
          fi
