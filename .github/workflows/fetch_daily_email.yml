name: Fetch Daily Briefing Email & Update GitHub Page

on:
  schedule:
    # Primary run: 7:30 AM IST (02:00 UTC)
    - cron: '0 2 * * *'
    # Backup run 1: 8:00 AM IST (02:30 UTC)
    - cron: '30 2 * * *'
    # Backup run 2: 8:30 AM IST (03:00 UTC)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Fetch Daily Email & Build HTML Page
        env:
          IMAP_SERVER: ${{ secrets.IMAP_SERVER || 'imap.gmail.com' }}
          IMAP_PORT: ${{ secrets.IMAP_PORT || '993' }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SENDER_FILTER: ${{ secrets.SENDER_FILTER }}
          SUBJECT_FILTER: ${{ secrets.SUBJECT_FILTER }}
        run: |
          python fetch_email.py

      - name: Commit and Push Updated HTML Page
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit."
          else
            git commit -m "Auto-update Daily Brief page from 7:00 AM email [skip ci]"
            git push
          fi
