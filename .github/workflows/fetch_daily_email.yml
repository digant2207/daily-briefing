name: Fetch Daily Briefing Email & Update GitHub Page

on:
  schedule:
    # Morning Window: Every 15 minutes from 06:30 AM to 11:30 AM IST (01:00 to 05:45 UTC)
    - cron: '*/15 1-5 * * *'
    # Market Hours & Afternoon: Every 30 minutes from 11:30 AM to 04:30 PM IST (06:00 to 10:30 UTC)
    - cron: '*/30 6-10 * * *'
    # Evening Catch-up: Hourly from 04:30 PM to 10:30 PM IST (11:00 to 17:00 UTC)
    - cron: '0 11-17 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Fetch Daily Email & Build HTML Page
        env:
          TZ: 'Asia/Kolkata'
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          IMAP_SERVER: ${{ secrets.IMAP_SERVER }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          SENDER_FILTER: ${{ secrets.SENDER_FILTER }}
          SUBJECT_FILTER: ${{ secrets.SUBJECT_FILTER }}
        run: |
          python fetch_email.py

      - name: Commit and Push Updated HTML Page
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes in index.html to commit."
          else
            git commit -m "Auto-update Daily Brief page from email [skip ci]"
            if ! git push origin main; then
              echo "Push failed due to remote changes. Rebasing and retrying..."
              git pull --rebase origin main
              git push origin main
            fi
          fi
